<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Sudan Play</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: rgb(74, 107, 255);
            --secondary: rgb(255, 94, 125);
            --accent: rgb(46, 196, 182);
            --dark: rgb(30, 30, 45);
            --light: rgb(248, 249, 254);
            --gradient: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            --gradient-sudan: linear-gradient(135deg, #2ec4b6 0%, var(--primary) 100%);
            --gradient-light: linear-gradient(135deg, rgba(74, 107, 255, 0.1) 0%, rgba(255, 94, 125, 0.1) 100%);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--dark);
            overflow: hidden;
            position: relative;
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .login-box {
            background: var(--light);
            padding: 40px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            width: 380px;
            text-align: center;
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease;
        }

        .login-box:hover {
            transform: translateY(-5px);
        }

        .login-box h2 {
            color: var(--primary);
            margin-bottom: 25px;
            font-weight: 700;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            background: var(--gradient-light);
            border-radius: 8px;
            padding: 10px 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .input-group:focus-within {
            box-shadow: 0 4px 15px rgba(74, 107, 255, 0.3);
        }

        .input-group i {
            color: var(--primary);
            font-size: 18px;
            margin-left: 10px;
        }

        .form-control {
            flex-grow: 1;
            border: none;
            background: transparent;
            padding: 5px 0;
            font-size: 16px;
            color: var(--dark);
            outline: none;
        }

        .form-control::placeholder {
            color: rgba(30, 30, 45, 0.6);
        }

        .btn-main {
            width: 100%;
            padding: 12px;
            background: var(--gradient);
            color: var(--light);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(74, 107, 255, 0.4);
            margin-bottom: 12px;
        }

        .btn-sudan {
            width: 100%;
            padding: 12px;
            background: var(--gradient-sudan);
            color: var(--light);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(46, 196, 182, 0.4);
        }

        .btn-main:hover, .btn-sudan:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .divider {
            margin: 15px 0;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            position: relative;
        }
        
        .divider span {
            background: var(--light);
            padding: 0 10px;
            position: relative;
            top: -10px;
            font-size: 12px;
            color: #666;
        }
    </style>

    <!-- مكتبات Firebase الأساسية (الإصدار 8) -->
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
</head>
<body>

    <div class="particles" id="particles-js"></div>

    <div class="login-box">
        <h2>تسجيل الدخول</h2>
        <form onsubmit="event.preventDefault();">

            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" class="form-control" placeholder="البريد الإلكتروني" required>
            </div>
            
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" class="form-control" placeholder="كلمة المرور" required>
            </div>
            
            <!-- زر تسجيل الدخول العادي / العام -->
            <button type="button" class="btn-main" onclick="loginGeneral()">
                <i class="fas fa-sign-in-alt"></i> تسجيل الدخول (عام)
            </button>

            <div class="divider"><span>أو</span></div>

            <!-- زر تسجيل الدخول عبر سودان بلاي -->
            <button type="button" class="btn-sudan" onclick="loginWithSudanPlay()">
                <i class="fas fa-store"></i> تسجيل الدخول عبر سودان بلاي
            </button>
        </form>
    </div>

    <!-- كود الجزيئات (Particles) -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyBJE_Ee-Dyh83iny45eH8lVtTSrIVqTzOI",
            authDomain: "sudan-play.firebaseapp.com",
            projectId: "sudan-play",
            storageBucket: "sudan-play.firebasestorage.app",
            messagingSenderId: "981764948623",
            appId: "1:981764948623:web:00e5c9268198f70e39a6fa"
        };
        
        firebase.initializeApp(firebaseConfig);

        // وظيفة الدخول العامة
        function loginGeneral() {
            executeFirebaseLogin("تم تسجيل الدخول العام بنجاح!");
        }

        // وظيفة الدخول عبر سودان بلاي
        function loginWithSudanPlay() {
            executeFirebaseLogin("تم تسجيل الدخول عبر حساب سودان بلاي بنجاح!");
        }

        // الدالة الموحدة للتعامل مع Firebase والتوجيه الذكي
        function executeFirebaseLogin(successMessage) {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert("الرجاء إدخال البريد الإلكتروني وكلمة المرور.");
                return;
            }

            firebase.auth().signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    localStorage.setItem('sudanPlayAdmin', user.uid);
                    
                    // التوجيه الذكي للصفحة المقصودة (مثل فور يو) أو لوحة التحكم كافتراضي
                    const targetPage = localStorage.getItem('redirectAfterLogin') || 'dashboard.html';
                    localStorage.removeItem('redirectAfterLogin');
                    window.location.href = targetPage; 
                })
                .catch((error) => {
                    alert('خطأ في تسجيل الدخول: ' + error.message);
                });
        }

        function createParticles() {
            particlesJS('particles-js', {
                "particles": {
                    "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
                    "color": { "value": "#ffffff" },
                    "shape": { "type": "circle", "stroke": { "width": 0, "color": "#000000" } },
                    "opacity": { "value": 0.5, "random": false, "anim": { "enable": false } },
                    "size": { "value": 3, "random": true, "anim": { "enable": false } },
                    "line_linked": { "enable": true, "distance": 150, "color": "#ffffff", "opacity": 0.4, "width": 1 },
                    "move": { "enable": true, "speed": 6, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false }
                },
                "interactivity": {
                    "detect_on": "canvas", "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" } }
                }
            });
        }

        function checkExistingLogin() {
            const session = localStorage.getItem('sudanPlayAdmin');
            if (session) {
                const targetPage = localStorage.getItem('redirectAfterLogin') || 'dashboard.html';
                localStorage.removeItem('redirectAfterLogin');
                window.location.href = targetPage;
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            createParticles();
            checkExistingLogin();
        });
    </script>
</body>
</html>
